org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Toolchains are provisioned deterministically via the Foojay resolver
# (settings.gradle): auto-detect is disabled so broken/partial local installs
# (e.g. a bare JRE 8 without tools.jar) are never selected as toolchains.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
