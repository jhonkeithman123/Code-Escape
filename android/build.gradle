def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFilePath = (keystoreProperties.getProperty("storeFile")
        ?: System.getenv("ANDROID_KEYSTORE_PATH")
        ?: findProperty("android.injected.signing.store.file"))
def releaseStorePassword = (keystoreProperties.getProperty("storePassword")
        ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
        ?: findProperty("android.injected.signing.store.password"))
def releaseKeyAlias = (keystoreProperties.getProperty("keyAlias")
        ?: System.getenv("ANDROID_KEY_ALIAS")
        ?: findProperty("android.injected.signing.key.alias"))
def releaseKeyPassword = (keystoreProperties.getProperty("keyPassword")
        ?: System.getenv("ANDROID_KEY_PASSWORD")
        ?: findProperty("android.injected.signing.key.password"))
def signingValues = [storeFile: releaseStoreFilePath, storePassword: releaseStorePassword,
                     keyAlias: releaseKeyAlias, keyPassword: releaseKeyPassword]
def missingSigningKeys = signingValues.findAll { !it.value }.keySet()
def hasReleaseSigning = missingSigningKeys.isEmpty()

// Fail-safe diagnostics: debug builds are never affected; problems surface as
// warnings at configuration time and the release APK is simply unsigned.
if (!missingSigningKeys.isEmpty()) {
    if (missingSigningKeys.size() < signingValues.size()) {
        println("WARNING: Android release signing is only PARTIALLY configured; missing: ${missingSigningKeys.join(', ')}. " +
                "The release APK will be UNSIGNED until all of: keystore.properties (storeFile, storePassword, keyAlias, keyPassword), " +
                "ANDROID_KEYSTORE_* / ANDROID_KEY_* environment variables, or android.injected.signing.* Gradle properties are provided. " +
                "Debug builds are unaffected. See keystore.properties.example.")
    } else if (keystorePropertiesFile.exists()) {
        println("NOTE: ${keystorePropertiesFile.name} exists but is empty/invalid; release builds will be unsigned. See keystore.properties.example.")
    }
}
if (hasReleaseSigning) {
    def storeFileResolved = rootProject.file(releaseStoreFilePath.toString())
    if (!storeFileResolved.exists()) {
        println("WARNING: Android release keystore file not found at: ${storeFileResolved} - release packaging will fail. " +
                "Check storeFile in keystore.properties or ANDROID_KEYSTORE_PATH.")
    }
}

