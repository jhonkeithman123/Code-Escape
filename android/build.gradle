// NOTE: The task name `packageRelease` is reserved by the Android Gradle Plugin
// (it packages the release APK for the release variant). Our versioned-output
// collector therefore uses a distinct name. It packages the signed release APK
// when release signing is configured, otherwise falls back to the debug APK.
tasks.register("packageReleaseArtifacts") {
    group = "build"
    description = "Copies a distributable Android APK (release if signed, else debug) into output/v<version>/android."
    dependsOn(hasReleaseSigning ? "assembleRelease" : "assembleDebug")
    doLast {
        def v = project.version.toString()
        def outDir = file("${rootDir}/output/v${v}/android")
        outDir.mkdirs()
        def variant = hasReleaseSigning ? "release" : "debug"
        def apkDir = file("${buildDir}/outputs/apk/${variant}")
        if (apkDir.exists()) {
            copy {
                from(apkDir) { include("*.apk") }
                into(outDir)
            }
        }
        if (hasReleaseSigning) {
            println("Android release APK packaged to: ${outDir}")
        } else {
            println("Android debug APK packaged to: ${outDir} (no release signing configured; see keystore.properties.example)")
        }
    }
}
