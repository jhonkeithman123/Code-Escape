name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-checks:
    name: Java checks (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['8', '17', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.7 runs on JDK 8+, but AGP 8.2.2 requires JDK 17, so the Gradle
      # runtime is always 17. Compilation/test toolchains are provisioned
      # deterministically via the Foojay resolver (see gradle.properties); the
      # matrix JDK is still installed so other tooling can use it.
      - name: Set up JDK 17 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK ${{ matrix.java }} (runtime availability check)
        if: matrix.java != '17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Show tooling (ce doctor)
        if: runner.os == 'Linux'
        shell: bash
        run: sh ./ce doctor

      - name: Build and test core/desktop
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            G="sh ./gradlew"
          else
            G="gradle"
          fi
          echo "Using Gradle command: $G"
          # Core/desktop are configured for Java 8 bytecode/toolchain compatibility.
          $G :core:build :desktop:build :core:test :desktop:test --stacktrace

  android-checks:
    name: Android checks (SDK, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble and lint Android debug
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            G="sh ./gradlew"
          else
            G="gradle"
          fi
          echo "Using Gradle command: $G"
          $G :android:assembleDebug :android:lintDebug :android:packageReleaseArtifacts --stacktrace

      # packageReleaseArtifacts above falls back to the debug APK when release
      # signing is absent, so this stays green without secrets. To produce a
      # signed release APK in CI, expose the four secrets below as environment
      # variables (same precedence chain documented in keystore.properties.example):
      #   ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # then additionally run: $G :android:assembleRelease

      - name: Run Android unit tests (if present)
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            G="sh ./gradlew"
          else
            G="gradle"
          fi
          $G :android:testDebugUnitTest --stacktrace || echo "No Android unit tests or task unavailable; continuing."
